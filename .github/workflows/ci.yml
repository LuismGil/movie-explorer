name: CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  quality-gate:
    name: Quality Gate (Next.js standalone)
    # Playwright 1.60.0 does not support the Ubuntu 26.04 ubuntu-latest image.
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit Tests
        run: npm run test -- --run

      - name: Atomic AI Rate Limit (isolated local Redis)
        run: npm run test:ai:rate-limit

      - name: Build and Assemble Standalone Server
        run: npm run build

      - name: Check Browser Bundle Boundaries
        run: npm run check:client-bundle
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}

      - name: Install Playwright Browsers
        run: npx playwright install chromium --with-deps

      - name: Run Accessibility Audit
        timeout-minutes: 5
        run: |
          HOSTNAME=127.0.0.1 PORT=3000 node .next/standalone/server.js &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true; wait "$SERVER_PID" 2>/dev/null || true' EXIT
          # Wait for server to be responsive on port 3000
          for attempt in $(seq 1 30); do
            if curl --output /dev/null --silent --head --fail http://localhost:3000; then
              break
            fi
            sleep 1
          done
          curl --output /dev/null --silent --head --fail http://localhost:3000
          npm run test:a11y
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY || 'dummy' }}

      - name: Run Lighthouse CI Budget Check
        id: lighthouse
        timeout-minutes: 5
        run: node scripts/run-lighthouse-ci.mjs

      - name: Check Live TMDB Catalog
        if: ${{ !cancelled() && github.event_name == 'push' && (steps.lighthouse.outcome == 'success' || steps.lighthouse.outcome == 'failure') }}
        run: node scripts/check-tmdb-live.mjs
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}

      - name: Docker Build Smoke Test
        run: docker build -t movie-explorer:latest .

      - name: Summarize Lighthouse Catalog Evidence
        if: ${{ !cancelled() && (steps.lighthouse.outcome == 'success' || steps.lighthouse.outcome == 'failure') }}
        continue-on-error: true
        run: node scripts/summarize-lighthouse-catalog.mjs

      - name: Upload Lighthouse Reports
        if: ${{ !cancelled() && (steps.lighthouse.outcome == 'success' || steps.lighthouse.outcome == 'failure') }}
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-reports-attempt-${{ github.run_attempt }}
          path: |
            .lighthouseci/lhr-*.json
            .lighthouseci/lhr-*.html
            .lighthouseci/assertion-results.json
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7

  mcp-gate:
    name: Quality Gate (MCP Server)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/mcp-server

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit Tests
        run: npm run test

      - name: Build MCP Server
        run: npm run build
